version: "2.0"
workflows:
  intrakurikuler:
    label: "Intrakurikuler"
    description: "Alur dasar untuk perencanaan pembelajaran reguler di kelas."
    supported_fields:
      - "subject"
      - "grade_level"
      - "learning_goal"
      - "time_allocation"
      - "learning_outcomes"
      - "success_criteria"
      - "student_needs"
      - "learning_activities"
      - "assessment_strategy"
      - "differentiation_plan"
      - "resource_plan"
      - "output_format"
      - "implementation_notes"
    summary_required_fields:
      - "subject"
      - "grade_level"
      - "learning_goal"
      - "learning_outcomes"
      - "success_criteria"
      - "learning_activities"
      - "assessment_strategy"
    generation_required_fields:
      - "subject"
      - "grade_level"
      - "learning_goal"
      - "time_allocation"
      - "learning_outcomes"
      - "success_criteria"
      - "student_needs"
      - "learning_activities"
      - "assessment_strategy"
      - "differentiation_plan"
      - "resource_plan"
      - "output_format"
      - "implementation_notes"
    stages:
      - id: "intra_context_brief"
        label: "Context Brief"
        description: "Tangkap identitas kelas, mata pelajaran, tujuan pembelajaran, dan batas waktu yang akan dipakai sebagai dasar sesi."
        required_fields:
          - "subject"
          - "grade_level"
          - "learning_goal"
          - "time_allocation"
        next_stage: "intra_learning_targets"
      - id: "intra_learning_targets"
        label: "Learning Targets"
        description: "Definisikan capaian, indikator keberhasilan, dan kebutuhan belajar utama yang harus dicapai."
        required_fields:
          - "learning_outcomes"
          - "success_criteria"
          - "student_needs"
        next_stage: "intra_learning_design"
      - id: "intra_learning_design"
        label: "Learning Design"
        description: "Susun aktivitas inti, strategi diferensiasi, dan bukti asesmen yang akan digunakan."
        required_fields:
          - "learning_activities"
          - "assessment_strategy"
          - "differentiation_plan"
        next_stage: "intra_readiness_check"
      - id: "intra_readiness_check"
        label: "Readiness Check"
        description: "Pastikan format keluaran, sumber belajar, dan catatan implementasi sudah cukup untuk masuk ke tahap generasi dokumen."
        required_fields:
          - "resource_plan"
          - "output_format"
          - "implementation_notes"
        next_stage: null
  pjbl:
    label: "PjBL"
    description: "Alur PjBL yang lebih kaya untuk perencanaan kokurikuler dari konteks, tujuan, desain proyek, asesmen, sampai finalisasi dokumen."
    supported_fields:
      - "education_level"
      - "phase"
      - "grade_level"
      - "subject_or_theme"
      - "topic"
      - "duration"
      - "school_context"
      - "student_characteristics"
      - "project_theme"
      - "problem_context"
      - "project_objectives"
      - "target_competencies"
      - "character_values"
      - "six_c_elements"
      - "project_title"
      - "driving_question"
      - "project_stages"
      - "grouping_strategy"
      - "student_roles"
      - "final_product"
      - "assessment_focus"
      - "assessment_rubric"
      - "process_indicators"
      - "product_indicators"
      - "resources_needed"
      - "tools_materials"
      - "teacher_facilitation_plan"
      - "reflection_prompt"
      - "follow_up_plan"
    summary_required_fields:
      - "education_level"
      - "phase"
      - "grade_level"
      - "subject_or_theme"
      - "topic"
      - "duration"
      - "school_context"
      - "student_characteristics"
      - "project_theme"
      - "problem_context"
      - "project_objectives"
      - "target_competencies"
      - "character_values"
      - "six_c_elements"
      - "project_title"
      - "driving_question"
      - "project_stages"
      - "grouping_strategy"
      - "student_roles"
      - "final_product"
    generation_required_fields:
      - "education_level"
      - "phase"
      - "grade_level"
      - "subject_or_theme"
      - "topic"
      - "duration"
      - "school_context"
      - "student_characteristics"
      - "project_theme"
      - "problem_context"
      - "project_objectives"
      - "target_competencies"
      - "character_values"
      - "six_c_elements"
      - "project_title"
      - "driving_question"
      - "project_stages"
      - "grouping_strategy"
      - "student_roles"
      - "final_product"
      - "assessment_focus"
      - "assessment_rubric"
      - "process_indicators"
      - "product_indicators"
      - "resources_needed"
      - "tools_materials"
      - "teacher_facilitation_plan"
      - "reflection_prompt"
      - "follow_up_plan"
    stages:
      - id: "pjbl_context_foundation"
        label: "Context Foundation"
        description: "Tetapkan konteks pendidikan, profil kelas, tema, dan kondisi sekolah yang menjadi dasar proyek."
        required_fields:
          - "education_level"
          - "phase"
          - "grade_level"
          - "subject_or_theme"
          - "topic"
          - "duration"
          - "school_context"
          - "student_characteristics"
          - "project_theme"
        next_stage: "pjbl_objective_alignment"
      - id: "pjbl_objective_alignment"
        label: "Objective Alignment"
        description: "Rumuskan konteks masalah, tujuan proyek, kompetensi sasaran, nilai karakter, dan elemen 6C."
        required_fields:
          - "problem_context"
          - "project_objectives"
          - "target_competencies"
          - "character_values"
          - "six_c_elements"
        next_stage: "pjbl_project_design"
      - id: "pjbl_project_design"
        label: "Project Design"
        description: "Tetapkan judul proyek, driving question, tahapan kerja, strategi kelompok, peran siswa, dan produk akhir."
        required_fields:
          - "project_title"
          - "driving_question"
          - "project_stages"
          - "grouping_strategy"
          - "student_roles"
          - "final_product"
        next_stage: "pjbl_assessment_and_support"
      - id: "pjbl_assessment_and_support"
        label: "Assessment And Support"
        description: "Lengkapi fokus asesmen, rubrik, indikator, kebutuhan sumber daya, fasilitasi guru, refleksi, dan tindak lanjut."
        required_fields:
          - "assessment_focus"
          - "assessment_rubric"
          - "process_indicators"
          - "product_indicators"
          - "resources_needed"
          - "tools_materials"
          - "teacher_facilitation_plan"
          - "reflection_prompt"
          - "follow_up_plan"
        next_stage: "pjbl_finalization"
      - id: "pjbl_finalization"
        label: "Finalization"
        description: "Semua field domain sudah lengkap dan planning state siap untuk summary maupun generation."
        required_fields: []
        next_stage: null
